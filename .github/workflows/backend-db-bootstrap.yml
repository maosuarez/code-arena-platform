name: Sync MongoDB Atlas indexes

# Vercel's Python function build has no reliable post-deploy hook, and the
# FastAPI lifespan skips ensure_indexes()/seed_admin() on Vercel (ASGI lifespan
# events aren't guaranteed to run there — see backend/app/main.py). This
# workflow is the only thing that actually applies backend/app/database.py's
# _INDEXES to the production Atlas cluster after a change. bootstrap_db.py is
# idempotent, so running it on every backend push is safe.

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run bootstrap_db.py against Atlas
        working-directory: backend
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
        run: python scripts/bootstrap_db.py
