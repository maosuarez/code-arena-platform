name: Sync MongoDB Atlas indexes

# Vercel's Python function build has no reliable post-deploy hook, and the
# FastAPI lifespan skips ensure_indexes()/seed_admin() on Vercel (ASGI lifespan
# events aren't guaranteed to run there — see backend/app/main.py). This
# workflow is the only thing that applies backend/app/database.py's _INDEXES
# to the production Atlas cluster.
#
# Manual only, on purpose: this runs against the real production database, so
# it's not wired to `push` — a bad commit or compromised PR should never be
# able to touch prod data with no human in the loop. Trigger it yourself after
# a backend deploy that changed _INDEXES or seed_admin logic. See CLAUDE.md
# for how.

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run bootstrap_db.py against Atlas
        working-directory: backend
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
        run: python scripts/bootstrap_db.py
